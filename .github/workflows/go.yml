name: Unzip and Build

on:
  push:
    paths:
      - 'steelfront.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: Extract source into repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract
        run: |
          if [ -f steelfront.zip ]; then
            unzip -o steelfront.zip -d .
            rm -f steelfront.zip
          else
            echo "No zip in repo - building from committed source (manual run)."
          fi

      - name: Commit source (never touching workflow files)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extract SteelFront source"
            git push
          fi

  build:
    name: Build unsigned IPA
    runs-on: macos-15
    needs: unpack
    steps:
      - uses: actions/checkout@v4

      - name: Get project source (from zip if present, else from repo)
        run: |
          if [ -f steelfront.zip ]; then
            unzip -o steelfront.zip -d .
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run logic tests
        run: swift test --parallel

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SteelFront.xcodeproj \
            -scheme SteelFront \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SteelFront.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee xcodebuild.log

      - name: Publish build errors to repo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: $GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT) - $(date -u)"
            echo "----- errors with context -----"
            grep -B1 -A3 "error:" xcodebuild.log 2>/dev/null | head -150 || true
            echo "----- summary -----"
            grep -E "Undefined symbols|ld: |ARCHIVE FAILED" xcodebuild.log 2>/dev/null | sort -u | head -20 || true
          } > /tmp/build-errors.txt
          B64=$(base64 -i /tmp/build-errors.txt | tr -d '\n')
          EXISTING_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-errors.txt?ref=main" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('sha',''))" || true)
          if [ -n "$EXISTING_SHA" ]; then SHA_JSON=",\"sha\":\"$EXISTING_SHA\""; else SHA_JSON=""; fi
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"Publish build errors (run $GITHUB_RUN_NUMBER)\",\"branch\":\"main\",\"content\":\"$B64\"$SHA_JSON}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-errors.txt" \
            > /tmp/put-result.json
          if grep -q '"content"' /tmp/put-result.json; then
            echo "build-errors.txt published OK"
          else
            echo "publish failed:"; cat /tmp/put-result.json
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/SteelFront.xcarchive/Products/Applications/SteelFront.app Payload/
          zip -qr SteelFront-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelFront-unsigned-ipa
          path: SteelFront-unsigned.ipa
          retention-days: 30
