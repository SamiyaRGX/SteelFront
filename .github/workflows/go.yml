name: Unzip and Build

on:
  push:
    paths:
      - 'steelfront.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: Extract source into repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract
        run: |
          if [ -f steelfront.zip ]; then
            unzip -o steelfront.zip -d .
            rm -f steelfront.zip
          else
            echo "No zip in repo - building from committed source (manual run)."
          fi

      - name: Commit source (never touching workflow files)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extract SteelFront source"
            git push
          fi

  build:
    name: Build unsigned IPA
    runs-on: macos-15
    needs: unpack
    steps:
      - uses: actions/checkout@v4

      - name: Get project source (from zip if present, else from repo)
        run: |
          if [ -f steelfront.zip ]; then
            unzip -o steelfront.zip -d .
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run logic tests
        run: swift test --parallel

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SteelFront.xcodeproj \
            -scheme SteelFront \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SteelFront.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee xcodebuild.log

      - name: Publish build errors to repo
        if: failure()
        run: |
          {
            echo "Run: $GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT) - $(date -u)"
            echo "-----"
            grep -E "error:|Undefined symbols|ARCHIVE FAILED" xcodebuild.log 2>/dev/null | sort -u | head -80
          } > /tmp/build-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          cp /tmp/build-errors.txt build-errors.txt
          git add build-errors.txt
          if git diff --cached --quiet; then
            echo "build-errors.txt unchanged"
          else
            git commit -m "Publish build errors (run $GITHUB_RUN_NUMBER)"
            git push origin main
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/SteelFront.xcarchive/Products/Applications/SteelFront.app Payload/
          zip -qr SteelFront-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelFront-unsigned-ipa
          path: SteelFront-unsigned.ipa
          retention-days: 30
