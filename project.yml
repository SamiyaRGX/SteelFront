# XcodeGen project specification.
#
#   brew install xcodegen
#   xcodegen generate
#   open SteelFront.xcodeproj
#
# The generated project is deliberately not committed: it is reproducible from
# this file, which keeps diffs readable and merge conflicts impossible.

name: SteelFront
options:
  bundleIdPrefix: com.steelfront
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad
    ENABLE_BITCODE: NO
    DEVELOPMENT_LANGUAGE: en
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_OPTIMIZATION_LEVEL: s
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    # Signing is left off: CI archives an unsigned .app that you re-sign with
    # your own certificate (Sideloadly / AltStore / esign). Open the project in
    # Xcode and pick your team to run on a device directly.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""

targets:
  SteelFront:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: Sources/Core
    settings:
      base:
        PRODUCT_NAME: SteelFront
        PRODUCT_BUNDLE_IDENTIFIER: com.steelfront.game
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: NO
        # Metal shaders in App/Rendering are compiled into default.metallib.
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        SWIFT_COMPILATION_MODE: wholemodule
    scheme:
      testTargets: []
      gatherCoverageData: false

